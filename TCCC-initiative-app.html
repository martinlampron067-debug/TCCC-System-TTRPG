<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saeculum: Persistent Initiative Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            text-align: center;
            color: #ff4d4d;
            margin-bottom: 5px;
        }
        h3 { color: #aaa; margin-top: 20px; border-bottom: 1px solid #444; padding-bottom: 5px;}
        .section {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 20px;
        }
        .inline-form {
            display: flex;
            gap: 10px;
        }
        input, select {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
        }
        input[type="text"] { flex: 2; }
        input[type="number"] { width: 80px; }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #cc0000; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #333; }
        button.delete-btn { background-color: #990000; padding: 4px 8px; font-size: 12px; }
        button.delete-btn:hover { background-color: #cc0000; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .current-turn-display {
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }
        .turn-list, .roster-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .turn-row, .roster-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d2d;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .turn-row { border-left: 5px solid #555; }
        .turn-row.active {
            background-color: #3d3d29;
            border-left-color: #ffeb3b;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.2);
        }
        .turn-row.passed { opacity: 0.4; background-color: #222; }
        .name { font-weight: bold; font-size: 18px; }
        .number {
            font-size: 18px;
            background-color: #444;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .roster-actions { display: flex; gap: 10px; align-items: center; }
        
        .delay-btn {
            background-color: #ffeb3b;
            color: #000;
            padding: 6px 12px;
            font-size: 13px;
        }
        .delay-btn:hover {
            background-color: #fbc02d;
        }

        /* Sub-layout elements for the complex virtual roller controls */
        .dice-roller-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
            background-color: #222;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .dice-controls-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .dice-select {
            padding: 6px;
            font-size: 13px;
            width: 110px;
        }
        /* Specialized highlighted look for active gear modifiers */
        .dice-select.situational-active {
            border-color: #00bcd4;
            background-color: #002b30;
        }
        .mod-input {
            width: 55px !important;
            padding: 6px;
            text-align: center;
            font-weight: bold;
        }
        /* Style adjustments when injury trackers are negative numbers */
        .mod-input.injured {
            background-color: #4d1a1a;
            color: #ff8080;
            border-color: #990000;
        }
        .manual-override-text {
            font-size: 11px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manual-input {
            width: 50px !important;
            padding: 4px;
            font-size: 11px;
        }
        .manual-btn {
            padding: 4px 8px;
            font-size: 11px;
            background-color: #555;
        }
        .manual-btn:hover { background-color: #444; }
    </style>
</head>
<body>

    <h1>Saeculum: Blood Of Ages</h1>
    <h2>Active Dance Tracker</h2>

    <div class="controls">
        <button onclick="previousTurn()">▲ Up</button>
        <div class="current-turn-display">Current Combat Turn: <span id="currentNumber">0</span></div>
        <button onclick="nextTurn()">▼ Down (Next)</button>
    </div>

    <div class="turn-list" id="trackerList"></div>
    
    <div style="text-align: center; margin-top: 15px;">
        <button class="secondary" onclick="clearCurrentDance()">Reset Current Dance</button>
    </div>

    <h3>👥 Combatant Roster (Keeps Names & Injuries During Battles)</h3>
    
    <div class="section">
        <p style="margin-top:0; color:#aaa; font-size:14px;">Add a new combatant to your permanent list:</p>
        <div class="inline-form">
            <input type="text" id="newName" placeholder="Character or Monster Name">
            <button onclick="addNewToRoster()">Add to Roster</button>
        </div>
    </div>

    <div class="roster-list" id="rosterContainer"></div>

    <script>
        // Internal state
        let roster = [];   // Holds names, persistent dice ranks, and lingering tracking maluses
        let timeline = []; // Holds the current active dance turns
        let currentTrackedNumber = 0;

        function addNewToRoster() {
            const nameInput = document.getElementById('newName');
            const name = nameInput.value.trim();
            if (!name) return;

            // Prevent duplicate tracking names
            if (roster.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                alert("A character with that name already exists!");
                return;
            }

            // Standardize default data state properties upon insertion 
            roster.push({ 
                name: name,
                smarts: "6",
                rapidity: "6",
                situational: "0", // Default: No situational die
                modifier: 0
            });
            nameInput.value = '';
            renderRoster();
        }

        function deleteFromRoster(index) {
            roster.splice(index, 1);
            renderRoster();
        }

        // Live capture updates to keep internal memory clean before re-sorting
        function updateRosterState(index) {
            roster[index].smarts = document.getElementById(`smarts-${index}`).value;
            roster[index].rapidity = document.getElementById(`rapidity-${index}`).value;
            roster[index].situational = document.getElementById(`situational-${index}`).value;
            
            const modVal = parseInt(document.getElementById(`mod-${index}`).value);
            roster[index].modifier = isNaN(modVal) ? 0 : modVal;

            // Dynamically flag input field styling indicators to track injuries clearly
            const modInput = document.getElementById(`mod-${index}`);
            if (roster[index].modifier < 0) {
                modInput.classList.add('injured');
            } else {
                modInput.classList.remove('injured');
            }

            // Highlight the selection box if a situational/wired reflex die is actively chosen
            const sitSelect = document.getElementById(`situational-${index}`);
            if (roster[index].situational !== "0") {
                sitSelect.classList.add('situational-active');
            } else {
                sitSelect.classList.remove('situational-active');
            }
        }

        function renderRoster() {
            const container = document.getElementById('rosterContainer');
            container.innerHTML = '';

            if (roster.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666;">No combatants in roster. Add some above!</p>`;
                return;
            }

            roster.forEach((character, index) => {
                const row = document.createElement('div');
                row.className = 'roster-row';
                
                // Track injury condition dynamically for color indicators
                const injuryClass = character.modifier < 0 ? 'mod-input injured' : 'mod-input';
                // Track if situational die highlight style should be applied initially
                const sitClass = character.situational !== "0" ? 'dice-select situational-active' : 'dice-select';

                row.innerHTML = `
                    <span class="name">${character.name}</span>
                    <div class="roster-actions">
                        <div class="dice-roller-group">
                            <div class="dice-controls-inline">
                                <select id="smarts-${index}" class="dice-select" title="Smarts Die Selection" onchange="updateRosterState(${index})">
                                    <option value="4" ${character.smarts === "4" ? "selected" : ""}>Smarts: d4</option>
                                    <option value="6" ${character.smarts === "6" ? "selected" : ""}>Smarts: d6</option>
                                    <option value="8" ${character.smarts === "8" ? "selected" : ""}>Smarts: d8</option>
                                    <option value="10" ${character.smarts === "10" ? "selected" : ""}>Smarts: d10</option>
                                    <option value="12" ${character.smarts === "12" ? "selected" : ""}>Smarts: d12</option>
                                </select>
                                <select id="rapidity-${index}" class="dice-select" title="Rapidity Die Selection" onchange="updateRosterState(${index})">
                                    <option value="4" ${character.rapidity === "4" ? "selected" : ""}>Rapid: d4</option>
                                    <option value="6" ${character.rapidity === "6" ? "selected" : ""}>Rapid: d6</option>
                                    <option value="8" ${character.rapidity === "8" ? "selected" : ""}>Rapid: d8</option>
                                    <option value="10" ${character.rapidity === "10" ? "selected" : ""}>Rapid: d10</option>
                                    <option value="12" ${character.rapidity === "12" ? "selected" : ""}>Rapid: d12</option>
                                </select>
                                <select id="situational-${index}" class="${sitClass}" title="Situational Gear/Reflex Die" onchange="updateRosterState(${index})">
                                    <option value="0" ${character.situational === "0" ? "selected" : ""}>Situational: None</option>
                                    <option value="4" ${character.situational === "4" ? "selected" : ""}>Sit: +d4</option>
                                    <option value="6" ${character.situational === "6" ? "selected" : ""}>Sit: +d6</option>
                                    <option value="8" ${character.situational === "8" ? "selected" : ""}>Sit: +d8</option>
                                    <option value="10" ${character.situational === "10" ? "selected" : ""}>Sit: +d10</option>
                                    <option value="12" ${character.situational === "12" ? "selected" : ""}>Sit: +d12</option>
                                </select>
                                <input type="number" id="mod-${index}" class="${injuryClass}" placeholder="Mod" value="${character.modifier}" oninput="updateRosterState(${index})" title=" Lingering Injury Tracker (Negative Values)">
                                <button onclick="rollVirtualInitiative(${index})" title="Roll Virtual Exploding Initiative Dice">🎲 Roll</button>
                            </div>
                            <div class="manual-override-text">
                                <span>Or manual score:</span>
                                <input type="number" id="roll-${index}" class="manual-input" placeholder="Score" min="1">
                                <button class="manual-btn" onclick="addRollToDance(${index})">Enter</button>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteFromRoster(${index})">Delete</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Simulates rolling a single die with Saeculum's Exploding Dice rules
        function rollExplodingDie(faces) {
            let total = 0;
            let roll = 0;
            do {
                roll = Math.floor(Math.random() * faces) + 1;
                total += roll;
            } while (roll === faces); // Keep exploding if the highest possible face score is rolled
            return total;
        }

        // Processes the mathematical calculation using virtual dice options
        function rollVirtualInitiative(index) {
            // Guarantee internal application array has latest settings
            updateRosterState(index);
            
            const character = roster[index];
            const smartsFaces = parseInt(character.smarts);
            const rapidityFaces = parseInt(character.rapidity);
            const situationalFaces = parseInt(character.situational);
            const modifier = character.modifier; // Value safely persists inside state memory now

            // Execute core attribute rolls using rule book criteria
            const smartsRoll = rollExplodingDie(smartsFaces);
            const rapidityRoll = rollExplodingDie(rapidityFaces);
            
            // Execute situational reflex roll if one is selected
            let situationalRoll = 0;
            if (situationalFaces > 0) {
                situationalRoll = rollExplodingDie(situationalFaces);
            }
            
            // Equation tally parsing attributes, new situational modifiers, and static adjustments
            let finalInitiativeScore = smartsRoll + rapidityRoll + situationalRoll + modifier;
            
            // Fail-safe protection boundary constraints
            if (finalInitiativeScore < 1) finalInitiativeScore = 1;

            // Log details cleanly to internal browser window debugging for auditing checks
            console.log(`Saeculum Roller Calculation [${character.name}]: Smarts(${smartsRoll}) + Rapidity(${rapidityRoll}) + Situational(${situationalRoll}) + Persistent Mod(${modifier}) = Total TCCC Score: ${finalInitiativeScore}`);

            // Direct injection to timeline processing script engine loop 
            injectScoreToTimeline(character.name, finalInitiativeScore);
        }

        function addRollToDance(index) {
            const rollInput = document.getElementById(`roll-${index}`);
            let score = parseInt(rollInput.value);
            const name = roster[index].name;

            if (isNaN(score) || score <= 0) return;

            injectScoreToTimeline(name, score);
            rollInput.value = ''; // clear input box
        }

        // Standard sequence handler used by both manual overrides and virtual processing methods
        function injectScoreToTimeline(name, score) {
            // Clear any existing instances of this exact person already in the current active timeline to avoid duplicates
            timeline = timeline.filter(item => item.name !== name);

            // Process the core Subtract 10 rule loop
            while (score > 0) {
                // Store originalTurnValue alongside turnValue to monitor maximum 5-turn delay limits
                timeline.push({ name: name, turnValue: score, originalTurnValue: score });
                score -= 10;
            }

            // Sort sequence from highest turn to lowest
            timeline.sort((a, b) => b.turnValue - a.turnValue);
            
            // Set clock to highest turn available if starting a fresh sequence
            if (currentTrackedNumber === 0 && timeline.length > 0) {
                currentTrackedNumber = timeline[0].turnValue;
            }

            renderActiveDance();
        }

        function delayActiveTurnOneTick(timelineIndex) {
            let currentItem = timeline[timelineIndex];
            
            // Delays by exactly 1 tick automatically
            let newTurnValue = currentItem.turnValue - 1;

            // Rule constraint verification: Maximum Delay of 5 Combat Turns past original turn number
            let totalDelayed = currentItem.originalTurnValue - newTurnValue;
            if (totalDelayed > 5) {
                alert(`Action Lost! Delaying further exceeds the limit of 5 Combat Turns past the original turn number (${currentItem.originalTurnValue}).`);
                timeline.splice(timelineIndex, 1); // Action is lost completely
            } else if (newTurnValue <= 0) {
                // Fallen out of the current Dance structure entirely
                timeline.splice(timelineIndex, 1);
            } else {
                // Update modern turn value state
                currentItem.turnValue = newTurnValue;
            }

            // Cleanly resort active timeline order matching highest countdown structure
            timeline.sort((a, b) => b.turnValue - a.turnValue);

            // Dynamically balance countdown element view window states after modification adjustments
            if (timeline.length > 0) {
                let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
                if (!uniqueTurns.includes(currentTrackedNumber)) {
                    currentTrackedNumber = uniqueTurns.find(t => t <= currentTrackedNumber) || 0;
                }
            } else {
                currentTrackedNumber = 0;
            }

            renderActiveDance();
        }

        function renderActiveDance() {
            const listContainer = document.getElementById('trackerList');
            document.getElementById('currentNumber').innerText = currentTrackedNumber;
            listContainer.innerHTML = '';

            if (timeline.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; color:#666;">No active combat turns. Input rolls below!</p>`;
                return;
            }

            timeline.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'turn-row';
                
                if (item.turnValue === currentTrackedNumber) {
                    row.classList.add('active');
                    row.innerHTML = `
                        <span class="name">${item.name}</span>
                        <div class="roster-actions">
                            <button class="delay-btn" onclick="delayActiveTurnOneTick(${index})">⏱ Delay 1 Turn</button>
                            <span class="number">Turn ${item.turnValue}</span>
                        </div>
                    `;
                } else {
                    if (item.turnValue > currentTrackedNumber) {
                        row.classList.add('passed');
                    }
                    row.innerHTML = `
                        <span class="name">${item.name}</span>
                        <span class="number">Turn ${item.turnValue}</span>
                    `;
                }

                listContainer.appendChild(row);
            });
        }

        function nextTurn() {
            if (timeline.length === 0) return;
            
            let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
            uniqueTurns.sort((a, b) => b - a);

            let nextIndex = uniqueTurns.findIndex(t => t < currentTrackedNumber);
            
            if (nextIndex !== -1) {
                currentTrackedNumber = uniqueTurns[nextIndex];
            } else {
                alert("End of the Dance reached! Click 'Reset Current Dance' to clear the timeline for the next round.");
            }
            renderActiveDance();
        }

        function previousTurn() {
            if (timeline.length === 0) return;

            let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
            uniqueTurns.sort((a, b) => b - a);

            let prevIndex = uniqueTurns.findLastIndex(t => t > currentTrackedNumber);
            
            if (prevIndex !== -1) {
                currentTrackedNumber = uniqueTurns[prevIndex];
            }
            renderActiveDance();
        }

        function clearCurrentDance() {
            timeline = [];
            currentTrackedNumber = 0;
            renderActiveDance();
        }

        // Initialize empty lists on load
        renderRoster();
        renderActiveDance();
    </script>
</body>
</html>
