    <style>
        :root {
            --bg-main: #0d0d0e;
            --bg-panel: #16171a;
            --bg-input: #202226;
            --border-color: #2d3138;
            --accent-blood: #9c1c1c;
            --accent-blood-hover: #bd2626;
            --text-gold: #e5c158;
            --text-dim: #8e95a0;
            --text-light: #f0f2f5;
        }

        body {
            font-family: 'Cinzel', 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            letter-spacing: 0.03em;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-top: env(safe-area-inset-top, 0px);
        }

        h1 {
            font-size: 22px;
            text-transform: uppercase;
            text-align: center;
            color: var(--text-light);
            margin: 0 0 4px 0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 13px;
            text-transform: uppercase;
            text-align: center;
            color: var(--accent-blood);
            margin: 0 0 20px 0;
            font-weight: 600;
            letter-spacing: 0.15em;
        }

        h3 { 
            color: var(--text-gold); 
            font-size: 14px;
            text-transform: uppercase;
            margin: 25px 0 12px 0; 
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            background: var(--bg-input);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input {
            background-color: transparent;
            color: var(--text-light);
            border: none;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            width: 100%;
            -webkit-user-select: text;
            user-select: text;
        }

        input::placeholder {
            color: #535963;
        }

        input[type="number"] { 
            width: 65px; 
            text-align: center;
            border-left: 1px solid var(--border-color);
        }

        button {
            background-color: var(--accent-blood);
            color: var(--text-light);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover { 
            background-color: var(--accent-blood-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button.secondary { 
            background-color: #24262b; 
            border: 1px solid var(--border-color);
            color: var(--text-dim);
        }
        button.secondary:hover { 
            background-color: #2d3036; 
            color: var(--text-light);
        }

        button.delete-btn { 
            background-color: #1a1b1e; 
            border: 1px solid #3d1414;
            color: #ff5959; 
            padding: 8px 12px;
        }
        button.delete-btn:hover { 
            background-color: #3d1414; 
        }

        button.delay-btn {
            background-color: transparent;
            border: 1px solid var(--text-gold);
            color: var(--text-gold);
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
        }
        button.delay-btn:hover {
            background: rgba(229, 193, 88, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            background-color: var(--bg-input);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .current-turn-display {
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .current-turn-display span {
            display: block;
            font-size: 28px;
            color: var(--text-gold);
            font-weight: 800;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(229, 193, 88, 0.2);
        }

        .turn-list, .roster-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .turn-row, .roster-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1b1f;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .turn-row { border-left: 4px solid #3a3f47; }
        
        .turn-row.active {
            background: linear-gradient(90deg, #1d1b15 0%, #16171a 100%);
            border-left-color: var(--text-gold);
            border-top: 1px solid rgba(229,193,88,0.15);
            border-right: 1px solid rgba(229,193,88,0.15);
            border-bottom: 1px solid rgba(229,193,88,0.15);
            box-shadow: inset 3px 0 10px rgba(229, 193, 88, 0.05);
        }

        .turn-row.passed { 
            opacity: 0.25; 
            filter: grayscale(50%);
        }

        .name { 
            font-weight: 600; 
            font-size: 15px; 
            color: var(--text-light);
        }
        
        .turn-row.passed .name {
            font-weight: 400;
        }

        .number {
            font-size: 12px;
            color: var(--text-dim);
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .turn-row.active .number {
            color: var(--text-gold);
            border-color: rgba(229,193,88,0.3);
            background: #24221a;
        }

        .roster-actions { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        .helper-text {
            color: var(--text-dim);
            font-size: 12px;
            margin: -4px 0 12px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Saeculum: Blood Of Ages</h1>
    <h2>Active Dance Tracker</h2>

    <div class="controls">
        <button onclick="previousTurn()">▲ Up</button>
        <div class="current-turn-display">Current TCCC Tick<span>Turn <span id="currentNumber" style="display:inline; font-size:inherit; font-weight:inherit; text-shadow:none;">0</span></span></div>
        <button onclick="nextTurn()">▼ Down</button>
    </div>

    <div class="turn-list" id="trackerList"></div>
    
    <div style="text-align: center; margin-top: 16px;">
        <button class="secondary" style="width: 100%;" onclick="clearCurrentDance()">Reset Current Dance</button>
    </div>

    <h3>👥 Combatant Roster</h3>
    <p class="helper-text">Names persist globally across combat encounters.</p>
    
    <div class="input-group" style="margin-bottom: 16px;">
        <input type="text" id="newName" placeholder="Character or Monster Name...">
        <button onclick="addNewToRoster()">Add</button>
    </div>

    <div class="roster-list" id="rosterContainer"></div>
</div>

    <script>
        let roster = [];   
        let timeline = []; 
        let currentTrackedNumber = 0;

        function addNewToRoster() {
            const nameInput = document.getElementById('newName');
            const name = nameInput.value.trim();
            if (!name) return;

            if (roster.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                alert("A character with that name already exists!");
                return;
            }

            roster.push({ name: name });
            nameInput.value = '';
            renderRoster();
        }

        function deleteFromRoster(index) {
            roster.splice(index, 1);
            renderRoster();
        }

        function renderRoster() {
            const container = document.getElementById('rosterContainer');
            container.innerHTML = '';

            if (roster.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#535963; font-size:13px; margin: 10px 0;">No combatants in roster. Add some above!</p>`;
                return;
            }

            roster.forEach((character, index) => {
                const row = document.createElement('div');
                row.className = 'roster-row';
                row.innerHTML = `
                    <span class="name">${character.name}</span>
                    <div class="roster-actions">
                        <div class="input-group">
                            <input type="number" id="roll-${index}" placeholder="Roll" min="1">
                            <button onclick="addRollToDance(${index})">Roll In</button>
                        </div>
                        <button class="delete-btn" onclick="deleteFromRoster(${index})">✕</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function addRollToDance(index) {
            const rollInput = document.getElementById(`roll-${index}`);
            let score = parseInt(rollInput.value);
            const name = roster[index].name;

            if (isNaN(score) || score <= 0) return;

            timeline = timeline.filter(item => item.name !== name);

            while (score > 0) {
                timeline.push({ name: name, turnValue: score, originalTurnValue: score });
                score -= 10;
            }

            timeline.sort((a, b) => b.turnValue - a.turnValue);
            
            if (currentTrackedNumber === 0 && timeline.length > 0) {
                currentTrackedNumber = timeline[0].turnValue;
            }

            rollInput.value = ''; 
            renderActiveDance();
        }

        function delayActiveTurnOneTick(timelineIndex) {
            let currentItem = timeline[timelineIndex];
            let newTurnValue = currentItem.turnValue - 1;

            let totalDelayed = currentItem.originalTurnValue - newTurnValue;
            if (totalDelayed > 5) {
                alert(`Action Lost! Delaying further exceeds the limit of 5 Combat Turns past the original turn number (${currentItem.originalTurnValue}).`);
                timeline.splice(timelineIndex, 1); 
            } else if (newTurnValue <= 0) {
                timeline.splice(timelineIndex, 1);
            } else {
                currentItem.turnValue = newTurnValue;
            }

            timeline.sort((a, b) => b.turnValue - a.turnValue);

            if (timeline.length > 0) {
                let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
                if (!uniqueTurns.includes(currentTrackedNumber)) {
                    currentTrackedNumber = uniqueTurns.find(t => t <= currentTrackedNumber) || 0;
                }
            } else {
                currentTrackedNumber = 0;
            }

            renderActiveDance();
        }

        function renderActiveDance() {
            const listContainer = document.getElementById('trackerList');
            document.getElementById('currentNumber').innerText = currentTrackedNumber;
            listContainer.innerHTML = '';

            if (timeline.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; color:#535963; font-size:13px; margin:20px 0;">No active combat turns. Input rolls below!</p>`;
                return;
            }

            timeline.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'turn-row';
                
                if (item.turnValue === currentTrackedNumber) {
                    row.classList.add('active');
                    row.innerHTML = `
                        <span class="name">${item.name}</span>
                        <div class="roster-actions">
                            <button class="delay-btn" onclick="delayActiveTurnOneTick(${index})">⏱ Delay</button>
                            <span class="number">T. ${item.turnValue}</span>
                        </div>
                    `;
                } else {
                    if (item.turnValue > currentTrackedNumber) {
                        row.classList.add('passed');
                    }
                    row.innerHTML = `
                        <span class="name">${item.name}</span>
                        <span class="number">T. ${item.turnValue}</span>
                    `;
                }

                listContainer.appendChild(row);
            });
        }

        function nextTurn() {
            if (timeline.length === 0) return;
            
            let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
            uniqueTurns.sort((a, b) => b - a);

            let nextIndex = uniqueTurns.findIndex(t => t < currentTrackedNumber);
            
            if (nextIndex !== -1) {
                currentTrackedNumber = uniqueTurns[nextIndex];
            } else {
                alert("End of the Dance reached! Click 'Reset Current Dance' to clear the timeline for the next round.");
            }
            renderActiveDance();
        }

        function previousTurn() {
            if (timeline.length === 0) return;

            let uniqueTurns = [...new Set(timeline.map(item => item.turnValue))];
            uniqueTurns.sort((a, b) => b - a);

            let prevIndex = uniqueTurns.findLastIndex(t => t > currentTrackedNumber);
            
            if (prevIndex !== -1) {
                currentTrackedNumber = uniqueTurns[prevIndex];
            }
            renderActiveDance();
        }

        function clearCurrentDance() {
            timeline = [];
            currentTrackedNumber = 0;
            renderActiveDance();
        }

        renderRoster();
        renderActiveDance();
    </script>
</body>
</html>
